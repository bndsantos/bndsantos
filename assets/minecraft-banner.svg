<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">Bruno Santos — Minecraft Plugin Developer</title>
  <desc id="description">Banner animado em pixel art com céu noturno, blocos, partículas e elementos inspirados em um mundo de blocos.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="1" stop-color="#14243a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3c00"/>
      <stop offset="0.5" stop-color="#fc6100"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="dirt" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#70412b"/>
      <rect x="3" y="5" width="7" height="5" fill="#8a5437"/>
      <rect x="20" y="3" width="8" height="7" fill="#57301f"/>
      <rect x="12" y="18" width="6" height="5" fill="#512d1e"/>
      <rect x="24" y="24" width="5" height="5" fill="#945d3d"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="14" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <rect x="85" y="48" width="4" height="4"><animate attributeName="opacity" values=".25;1;.25" dur="2.7s" repeatCount="indefinite"/></rect>
    <rect x="190" y="78" width="5" height="5"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></rect>
    <rect x="328" y="38" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></rect>
    <rect x="892" y="58" width="4" height="4"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="1040" y="34" width="5" height="5"><animate attributeName="opacity" values=".3;1;.3" dur="3.4s" repeatCount="indefinite"/></rect>
    <rect x="1128" y="92" width="3" height="3"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/></rect>
  </g>

  <!-- moon -->
  <g filter="url(#glow)">
    <rect x="1080" y="38" width="52" height="52" fill="#ffe6a0"/>
    <rect x="1072" y="46" width="68" height="36" fill="#ffe6a0"/>
    <rect x="1088" y="30" width="36" height="68" fill="#ffe6a0"/>
    <rect x="1090" y="48" width="9" height="9" fill="#dbc47f"/>
    <rect x="1115" y="68" width="8" height="8" fill="#dbc47f"/>
  </g>

  <!-- moving clouds -->
  <g fill="#dbe7f1" opacity=".72">
    <g>
      <rect x="-210" y="78" width="170" height="20"/>
      <rect x="-175" y="58" width="85" height="20"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1460 0" dur="25s" repeatCount="indefinite"/>
    </g>
    <g opacity=".55">
      <rect x="-360" y="128" width="210" height="18"/>
      <rect x="-320" y="110" width="105" height="18"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="1700 0" dur="37s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- glow behind title -->
  <rect x="160" y="77" width="880" height="132" rx="8" fill="#05070b" opacity=".62"/>
  <rect x="172" y="89" width="856" height="108" rx="4" fill="none" stroke="#fc6100" stroke-width="2" opacity=".55">
    <animate attributeName="stroke-opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="600" y="137" text-anchor="middle" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="42" font-weight="800" letter-spacing="3">BRUNO SANTOS</text>
  <rect x="341" y="153" width="518" height="5" fill="url(#orange)">
    <animate attributeName="width" values="80;518;80" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="560;341;560" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="185" text-anchor="middle" fill="#fc6100" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" letter-spacing="2">MINECRAFT PLUGIN DEVELOPER</text>

  <!-- floating code particles -->
  <g fill="#fc6100" opacity=".9">
    <rect x="120" y="205" width="8" height="8"><animateTransform attributeName="transform" type="translate" values="0 30;0 -160" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.4s" repeatCount="indefinite"/></rect>
    <rect x="1030" y="210" width="6" height="6"><animateTransform attributeName="transform" type="translate" values="0 25;0 -175" dur="5.2s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.2s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="980" y="240" width="5" height="5"><animateTransform attributeName="transform" type="translate" values="0 10;0 -140" dur="3.7s" begin=".4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.7s" begin=".4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- block landscape -->
  <rect x="0" y="250" width="1200" height="50" fill="url(#dirt)"/>
  <rect x="0" y="236" width="1200" height="14" fill="#28612c"/>
  <rect x="0" y="230" width="1200" height="10" fill="#45a049"/>
  <rect x="70" y="214" width="32" height="16" fill="#45a049"/>
  <rect x="70" y="230" width="32" height="20" fill="url(#dirt)"/>
  <rect x="1080" y="198" width="32" height="32" fill="#45a049"/>
  <rect x="1080" y="230" width="32" height="20" fill="url(#dirt)"/>
  <rect x="1112" y="214" width="32" height="16" fill="#45a049"/>
  <rect x="1112" y="230" width="32" height="20" fill="url(#dirt)"/>

  <!-- pixel pickaxe -->
  <g transform="translate(112 146)">
    <animateTransform attributeName="transform" additive="sum" type="rotate" values="-8 28 28;8 28 28;-8 28 28" dur="2.2s" repeatCount="indefinite"/>
    <rect x="26" y="19" width="10" height="78" transform="rotate(-42 31 58)" fill="#8c552f"/>
    <rect x="4" y="2" width="60" height="12" transform="rotate(-8 34 8)" fill="#cfd8df"/>
    <rect x="2" y="12" width="18" height="12" fill="#aeb9c0"/>
    <rect x="52" y="4" width="16" height="24" fill="#aeb9c0"/>
  </g>

  <!-- pixel creeper-inspired face -->
  <g transform="translate(1018 142)" opacity=".9">
    <rect width="82" height="82" fill="#3b923f"/>
    <rect x="12" y="14" width="20" height="20" fill="#102312"/>
    <rect x="50" y="14" width="20" height="20" fill="#102312"/>
    <rect x="31" y="34" width="20" height="20" fill="#102312"/>
    <rect x="20" y="51" width="42" height="20" fill="#102312"/>
    <animate attributeName="opacity" values=".72;1;.72" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <rect x="1" y="1" width="1198" height="298" rx="13" fill="none" stroke="#fc6100" stroke-width="2" opacity=".7"/>
</svg>
